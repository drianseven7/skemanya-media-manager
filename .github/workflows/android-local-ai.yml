name: Build SKEMANYA Android Local AI

on:
  push:
    branches:
      - android-local-ai
    paths:
      - "android/**"
      - ".github/workflows/android-local-ai.yml"
  workflow_dispatch:
  workflow_run:
    workflows:
      - SKEMANYA from-scratch CPU pilot
    types:
      - completed

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download trained SKEMANYA model and tokenizer
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: skemanya-internal-cpu-prototype
          path: /tmp/skemanya-trained
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Package verified model assets
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          mkdir -p android/app/src/main/assets
          test -s /tmp/skemanya-trained/skemanya.onnx
          test -s /tmp/skemanya-trained/skemanya_id.model
          test -s /tmp/skemanya-trained/training_config.json
          cp /tmp/skemanya-trained/skemanya.onnx android/app/src/main/assets/
          cp /tmp/skemanya-trained/skemanya_id.model android/app/src/main/assets/
          cp /tmp/skemanya-trained/training_config.json android/app/src/main/assets/
          echo 'Internal prototype model assets packaged.'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Locate Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "Searching for sdkmanager..."
          SDKMANAGER="$(find "$SDK_ROOT" /opt -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found. Android SDK directory contents:"
            ls -la "$SDK_ROOT" || true
            exit 1
          fi
          echo "Found: $SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install required Android SDK packages
        run: |
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: skemanya-local-ai-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
