name: SKEMANYA instruction-tuning prototype

on:
  push:
    branches:
      - android-local-ai
    paths:
      - "model/train_instruct.py"
      - "android/app/build.gradle.kts"
      - ".github/workflows/skemanya-instruct-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  instruct-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: android-local-ai

      - name: Download from-scratch pretraining checkpoint and tokenizer
        uses: actions/download-artifact@v4
        with:
          name: skemanya-from-scratch-cpu-pilot
          path: model/artifacts
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 45977188318

      - name: Download approved corpus, tokenizer, and attribution ledger
        uses: actions/download-artifact@v4
        with:
          name: skemanya-dataset-and-tokenizer
          path: model
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 45971771953

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: model/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r model/requirements.txt

      - name: Verify approval and matching pretraining assets
        run: |
          python -c "from pathlib import Path; from model.training_gate import require_commercial_training_approval; require_commercial_training_approval(Path('model/dataset/TRAINING_APPROVAL.json'))"
          test -s model/artifacts/skemanya-prototype.pt
          test -s model/artifacts/skemanya_id.model

      - name: Fine-tune on original SKEMANYA instruction seed
        run: python model/train_instruct.py

      - name: Export instruction-tuned SKEMANYA model to ONNX
        run: |
          python model/export_onnx.py --checkpoint model/artifacts/skemanya-instruct-prototype.pt --output model/artifacts/skemanya.onnx

      - name: Prepare offline APK assets and attribution
        run: |
          mkdir -p android/app/src/main/assets
          cp model/artifacts/skemanya.onnx android/app/src/main/assets/
          cp model/artifacts/skemanya_id.model android/app/src/main/assets/
          cp model/artifacts/training_config.json android/app/src/main/assets/
          cp model/dataset/raw/wikipedia_id_ccbysa_attribution.jsonl android/app/src/main/assets/

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Locate Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install required Android SDK packages
        run: |
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build instruction-tuned SKEMANYA APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload internal instruction-tuned APK
        uses: actions/upload-artifact@v4
        with:
          name: skemanya-ai-internal-instruct-prototype-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload instruction checkpoint and evaluation logs
        uses: actions/upload-artifact@v4
        with:
          name: skemanya-instruction-tuned-prototype
          path: |
            model/artifacts/skemanya-instruct-prototype.pt
            model/artifacts/skemanya.onnx
            model/artifacts/skemanya_id.model
            model/artifacts/training_config.json
            model/artifacts/instruction_training_history.json
            android/app/src/main/assets/wikipedia_id_ccbysa_attribution.jsonl
          if-no-files-found: error
          retention-days: 30
