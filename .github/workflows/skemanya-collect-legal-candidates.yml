name: SKEMANYA collect approved legal candidates

on:
  push:
    branches: [android-local-ai]
    paths:
      - "model/collect_official_legal_text.py"
      - "model/extract_official_legal_text.py"
      - "model/dataset/official_regulations_manifest.csv"
      - ".github/workflows/skemanya-collect-legal-candidates.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: android-local-ai
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PDF extraction dependency
        run: python -m pip install "pypdf>=5.0"
      - name: Collect manually approved official PDFs
        run: python model/collect_official_legal_text.py
      - name: Extract review-only candidate text
        run: python model/extract_official_legal_text.py
      - name: Upload candidate documents, text, and provenance
        uses: actions/upload-artifact@v4
        with:
          name: skemanya-official-legal-candidates
          path: model/dataset/official_regulations_candidate/
          if-no-files-found: warn
          retention-days: 14
