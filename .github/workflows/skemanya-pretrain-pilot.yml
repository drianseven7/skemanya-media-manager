name: SKEMANYA from-scratch CPU pilot

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Training steps (1–300)"
        required: true
        default: "300"
        type: string

permissions:
  contents: read

jobs:
  cpu-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: android-local-ai
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: model/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r model/requirements.txt
      - name: Verify source and approval gates
        run: |
          python -m compileall -q model
          python -c "from pathlib import Path; from model.training_gate import require_commercial_training_approval; require_commercial_training_approval(Path('model/dataset/TRAINING_APPROVAL.json'))"
      - name: Prepare approved corpus
        run: |
          python model/prepare_data.py
          python model/train_tokenizer.py
      - name: Train from random initialization on CPU
        run: python model/train.py --profile cpu-pilot --steps "${{ inputs.steps }}"
      - name: Upload prototype checkpoint and metrics
        uses: actions/upload-artifact@v4
        with:
          name: skemanya-from-scratch-cpu-pilot
          path: |
            model/artifacts/skemanya-prototype.pt
            model/artifacts/training_config.json
            model/artifacts/training_history.json
          if-no-files-found: error
          retention-days: 30
