name: SKEMANYA model checks

on:
  push:
    branches: [android-local-ai]
    paths:
      - "model/**"
      - ".github/workflows/skemanya-model-check.yml"
  pull_request:
    branches: [android-local-ai]
    paths:
      - "model/**"
      - ".github/workflows/skemanya-model-check.yml"
  workflow_dispatch:

concurrency:
  group: skemanya-model-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: model/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r model/requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q model
      - name: Run model smoke tests
        run: python -m unittest discover -s model/tests -v
